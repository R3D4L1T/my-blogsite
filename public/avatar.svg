<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E04800" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Square Background with Curved Corners -->
  <rect width="512" height="512" rx="96" fill="url(#orangeGrad)" />

  <!-- Modern Bold 'R' Letterform -->
  <path d="M 160 120 
           H 265 
           C 325 120, 365 155, 365 210 
           C 365 260, 330 292, 280 298 
           L 368 392 
           H 300 
           L 222 305 
           H 220 
           V 392 
           H 160 
           V 120 Z 
           M 220 172 
           V 253 
           H 260 
           C 292 253, 308 238, 308 212 
           C 308 187, 292 172, 260 172 
           H 220 Z" 
        fill="#FFFFFF" 
        filter="url(#dropShadow)" />
</svg>
